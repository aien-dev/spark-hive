[package]
name = "spark-hive"
version = "0.1.0"
edition = "2024"
authors = ["AIEN <aien.atlas@proton.me>"]
description = "Native Sovereign Honeycomb Hive Engine with 2D Axial Hexagonal Geometry and Consumer Model Adapter Pipeline"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aien-dev/spark-hive"
homepage = "https://github.com/aien-dev/spark-hive"
readme = "README.md"
keywords = ["agent-hive", "honeycomb", "axial-geometry", "model-adapters", "sovereign-ai"]
categories = ["asynchronous", "data-structures", "development-tools"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.17"
